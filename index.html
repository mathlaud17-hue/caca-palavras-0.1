
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a Palavra</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Adivinhe a Palavra</h1>
        <p class="descricao">
            Descubra a palavra de 5 letras em até 6 tentativas!
        </p>

        <section class="legenda">
            <p><span class="exemplo correta">A</span> Letra certa no lugar certo</p>
            <p><span class="exemplo presente">B</span> Letra existe em outra posição</p>
            <p><span class="exemplo errada">C</span> Letra não existe na palavra</p>
        </section>

        <section id="tabuleiro" class="tabuleiro"></section>

        <form id="formulario">
            <label for="entrada">Digite uma palavra:</label>
            <input
                id="entrada"
                type="text"
                maxlength="5"
                placeholder="Ex.: PEDRA"
                autocomplete="off"
                autocapitalize="characters"
                required
            >
            <button id="enviar" type="submit">Enviar</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite">
            Carregando dicionário...
        </p>

        <button id="novoJogo" class="secundario" type="button" disabled>
            Novo jogo
        </button>
    </main>
</body>
</html>
