
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça-Palavras</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>🔎 Caça-Palavras</h1>

    <p class="instrucoes">
      Encontre as palavras escondidas na grade!
      Clique na primeira e na última letra de cada palavra.
    </p>

    <h3>Palavras para encontrar:</h3>
    <div class="palavras" id="palavras"></div>

    <div id="grade"></div>

    <h3 class="pontuacao">
      🏆 Pontuação: <span id="pontos">0</span>
    </h3>

    <p id="mensagem" aria-live="polite">Boa sorte!</p>

    <button id="novoJogo" type="button">Novo jogo 🔄</button>
  </main>
</body>
</html>
